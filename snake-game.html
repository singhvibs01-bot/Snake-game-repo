<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #111827;
            --panel-alt: #1f2937;
            --board-bg: #0b1220;
            --snake: #34d399;
            --snake-head: #10b981;
            --food: #f87171;
            --text: #e5e7eb;
            --muted: #9ca3af;
            --accent: #60a5fa;
            --button: #2563eb;
            --button-hover: #1d4ed8;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #020817, var(--bg));
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            padding: 20px;
        }

        .app {
            width: min(92vw, 560px);
            background: rgba(17, 24, 39, 0.92);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.35);
        }

        h1 {
            margin: 0 0 16px;
            text-align: center;
            font-size: clamp(2rem, 3vw, 2.8rem);
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .stat {
            flex: 1;
            min-width: 100px;
            background: var(--panel-alt);
            border-radius: 12px;
            padding: 10px 12px;
            text-align: center;
            border: 1px solid rgba(148, 163, 184, 0.15);
        }

        .stat-label {
            display: block;
            font-size: 0.75rem;
            color: var(--muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .stat-value {
            display: block;
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 4px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .utility-controls {
            display: flex;
            justify-content: flex-end;
            margin: -6px 0 10px;
        }

        button {
            background: var(--button);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 18px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        button:hover {
            background: var(--button-hover);
            transform: translateY(-1px);
        }

        button.secondary {
            background: #374151;
        }

        button.secondary:hover {
            background: #4b5563;
        }

        .sound-btn {
            background: transparent;
            border: 1px solid rgba(148, 163, 184, 0.3);
            color: var(--muted);
            padding: 7px 10px;
            font-size: 0.85rem;
        }

        .sound-btn:hover,
        .sound-btn[aria-pressed="true"] {
            background: var(--panel-alt);
            color: var(--text);
        }

        .board-wrap {
            position: relative;
            background: var(--board-bg);
            border-radius: 14px;
            padding: 10px;
            border: 1px solid rgba(148, 163, 184, 0.15);
        }

        #game-board {
            display: grid;
            grid-template-columns: repeat(15, minmax(0, 1fr));
            width: 100%;
            aspect-ratio: 1;
            border-radius: 10px;
            overflow: hidden;
            background: #0b1220;
        }

        .cell {
            background: rgba(148, 163, 184, 0.05);
            border: 1px solid rgba(148, 163, 184, 0.06);
        }

        .cell.snake {
            background: var(--snake);
            border-radius: 3px;
        }

        .cell.snake-head {
            background: var(--snake-head);
        }

        .cell.food {
            background: var(--food);
            border-radius: 50%;
        }

        .board-overlay {
            position: absolute;
            inset: 10px;
            z-index: 1;
            display: grid;
            place-items: center;
            padding: 24px;
            border-radius: 10px;
            background: rgba(3, 10, 22, 0.84);
            text-align: center;
            backdrop-filter: blur(3px);
        }

        .board-overlay[hidden] {
            display: none;
        }

        .overlay-content {
            max-width: 280px;
            animation: appear 240ms ease-out both;
        }

        .overlay-kicker {
            margin: 0 0 8px;
            color: var(--snake);
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .overlay-title {
            margin: 0;
            font-size: 2rem;
        }

        .overlay-copy {
            margin: 10px 0 18px;
            color: var(--muted);
            line-height: 1.5;
        }

        .touch-controls {
            display: none;
            grid-template-columns: repeat(3, 54px);
            grid-template-rows: repeat(2, 48px);
            justify-content: center;
            gap: 6px;
            margin: 14px auto 0;
            touch-action: manipulation;
            user-select: none;
        }

        .touch-controls button {
            padding: 0;
            font-size: 1.35rem;
            background: #26364a;
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .touch-controls button:active {
            background: var(--button);
            transform: scale(0.96);
        }

        .touch-up {
            grid-column: 2;
        }

        .touch-left {
            grid-column: 1;
            grid-row: 2;
        }

        .touch-down {
            grid-column: 2;
            grid-row: 2;
        }

        .touch-right {
            grid-column: 3;
            grid-row: 2;
        }

        @keyframes appear {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message {
            margin-top: 16px;
            min-height: 24px;
            text-align: center;
            color: var(--muted);
            font-weight: 600;
        }

        @media (max-width: 500px) {
            .app {
                padding: 16px;
            }

            .scoreboard {
                gap: 8px;
            }

            .stat {
                min-width: 80px;
            }

            .touch-controls {
                display: grid;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <h1>Snake</h1>

        <div class="scoreboard">
            <div class="stat">
                <span class="stat-label">Score</span>
                <span id="score" class="stat-value">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Best</span>
                <span id="best-score" class="stat-value">0</span>
            </div>
        </div>

        <div class="controls">
            <button id="start-btn">Start Game</button>
            <button id="pause-btn" class="secondary">Pause</button>
        </div>

        <div class="utility-controls">
            <button id="sound-btn" class="sound-btn" type="button" aria-pressed="true" aria-label="Turn sound off">Sound on</button>
        </div>

        <div class="board-wrap">
            <div id="game-board" aria-label="Snake game board"></div>
            <div id="board-overlay" class="board-overlay">
                <div class="overlay-content">
                    <p id="overlay-kicker" class="overlay-kicker">Classic arcade</p>
                    <h2 id="overlay-title" class="overlay-title">Ready to run?</h2>
                    <p id="overlay-copy" class="overlay-copy">Collect the fruit, grow your snake, and avoid the walls.</p>
                    <button id="overlay-btn" type="button">Start game</button>
                </div>
            </div>
        </div>

        <div class="touch-controls" aria-label="Touch direction controls">
            <button class="touch-up" type="button" data-direction="ArrowUp" aria-label="Move up">↑</button>
            <button class="touch-left" type="button" data-direction="ArrowLeft" aria-label="Move left">←</button>
            <button class="touch-down" type="button" data-direction="ArrowDown" aria-label="Move down">↓</button>
            <button class="touch-right" type="button" data-direction="ArrowRight" aria-label="Move right">→</button>
        </div>

        <div id="message" class="message" aria-live="polite">Press Start to play</div>
    </div>

    <script>
        const boardSize = 15;
        const board = document.getElementById('game-board');
        const scoreEl = document.getElementById('score');
        const bestScoreEl = document.getElementById('best-score');
        const messageEl = document.getElementById('message');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const soundBtn = document.getElementById('sound-btn');
        const overlay = document.getElementById('board-overlay');
        const overlayKicker = document.getElementById('overlay-kicker');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayCopy = document.getElementById('overlay-copy');
        const overlayBtn = document.getElementById('overlay-btn');
        const touchButtons = document.querySelectorAll('[data-direction]');

        const cells = [];
        const directions = {
            ArrowUp: { x: 0, y: -1 },
            ArrowDown: { x: 0, y: 1 },
            ArrowLeft: { x: -1, y: 0 },
            ArrowRight: { x: 1, y: 0 },
            w: { x: 0, y: -1 },
            s: { x: 0, y: 1 },
            a: { x: -1, y: 0 },
            d: { x: 1, y: 0 }
        };

        const state = {
            snake: [],
            direction: { x: 1, y: 0 },
            pendingDirection: { x: 1, y: 0 },
            food: { x: 0, y: 0 },
            score: 0,
            bestScore: Number(localStorage.getItem('snakeBestScore') || 0),
            gameLoop: null,
            isRunning: false,
            isPaused: false
        };

        let audioContext = null;
        let soundEnabled = localStorage.getItem('snakeSoundEnabled') !== 'false';

        function playTone(frequency, duration = 0.09, type = 'sine') {
            if (!soundEnabled) return;

            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) return;

            audioContext ||= new AudioContextClass();
            if (audioContext.state === 'suspended') audioContext.resume();

            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();
            oscillator.type = type;
            oscillator.frequency.value = frequency;
            gain.gain.setValueAtTime(0.08, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration);
            oscillator.connect(gain);
            gain.connect(audioContext.destination);
            oscillator.start();
            oscillator.stop(audioContext.currentTime + duration);
        }

        function showOverlay(kicker, title, copy, buttonLabel, action) {
            overlayKicker.textContent = kicker;
            overlayTitle.textContent = title;
            overlayCopy.textContent = copy;
            overlayBtn.textContent = buttonLabel;
            overlayBtn.onclick = action;
            overlay.hidden = false;
        }

        function hideOverlay() {
            overlay.hidden = true;
        }

        function createBoard() {
            board.innerHTML = '';
            cells.length = 0;

            for (let index = 0; index < boardSize * boardSize; index++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                board.appendChild(cell);
                cells.push(cell);
            }
        }

        function updateBestScore() {
            bestScoreEl.textContent = state.bestScore;
        }

        function updateScore() {
            scoreEl.textContent = state.score;
        }

        function placeFood() {
            const freeCells = [];

            for (let y = 0; y < boardSize; y++) {
                for (let x = 0; x < boardSize; x++) {
                    const occupied = state.snake.some(segment => segment.x === x && segment.y === y);
                    if (!occupied) {
                        freeCells.push({ x, y });
                    }
                }
            }

            if (freeCells.length === 0) {
                state.food = { x: -1, y: -1 };
                return;
            }

            const randomIndex = Math.floor(Math.random() * freeCells.length);
            state.food = freeCells[randomIndex];
        }

        function drawBoard() {
            cells.forEach(cell => {
                cell.classList.remove('snake', 'snake-head', 'food');
            });

            state.snake.forEach((segment, index) => {
                const cellIndex = segment.y * boardSize + segment.x;
                if (cells[cellIndex]) {
                    cells[cellIndex].classList.add('snake');
                    if (index === 0) {
                        cells[cellIndex].classList.add('snake-head');
                    }
                }
            });

            if (state.food.x >= 0 && state.food.y >= 0) {
                const foodCellIndex = state.food.y * boardSize + state.food.x;
                if (cells[foodCellIndex]) {
                    cells[foodCellIndex].classList.add('food');
                }
            }
        }

        function resetGame() {
            state.snake = [
                { x: 7, y: 7 },
                { x: 6, y: 7 },
                { x: 5, y: 7 }
            ];
            state.direction = { x: 1, y: 0 };
            state.pendingDirection = { x: 1, y: 0 };
            state.score = 0;
            updateScore();
            placeFood();
            drawBoard();
        }

        function getSpeed() {
            return Math.max(70, 180 - state.score * 5);
        }

        function stopLoop() {
            if (state.gameLoop) {
                clearInterval(state.gameLoop);
                state.gameLoop = null;
            }
        }

        function endGame(message) {
            stopLoop();
            state.isRunning = false;
            state.isPaused = false;
            pauseBtn.textContent = 'Pause';
            messageEl.textContent = `${message} Press Start to play again.`;
            playTone(180, 0.3, 'triangle');
            showOverlay('Round complete', 'Game over', `You scored ${state.score}. Ready for another run?`, 'Play again', startGame);
        }

        function startGame() {
            stopLoop();
            resetGame();
            state.isRunning = true;
            state.isPaused = false;
            pauseBtn.textContent = 'Pause';
            messageEl.textContent = 'Game running';
            hideOverlay();
            playTone(520, 0.1);
            state.gameLoop = setInterval(tick, getSpeed());
        }

        function togglePause() {
            if (!state.isRunning) return;

            if (state.isPaused) {
                state.isPaused = false;
                pauseBtn.textContent = 'Pause';
                messageEl.textContent = 'Game running';
                hideOverlay();
                playTone(520, 0.1);
                state.gameLoop = setInterval(tick, getSpeed());
                return;
            }

            state.isPaused = true;
            pauseBtn.textContent = 'Resume';
            messageEl.textContent = 'Paused';
            stopLoop();
            showOverlay('Take a breath', 'Game paused', 'Your run is waiting right here.', 'Resume', togglePause);
        }

        overlayBtn.onclick = startGame;

        function tick() {
            if (state.pendingDirection) {
                const proposed = state.pendingDirection;
                const isOpposite = proposed.x === -state.direction.x && proposed.y === -state.direction.y;
                if (!isOpposite) {
                    state.direction = proposed;
                }
            }

            const head = {
                x: state.snake[0].x + state.direction.x,
                y: state.snake[0].y + state.direction.y
            };

            const nextSnake = [head, ...state.snake];
            const isEating = head.x === state.food.x && head.y === state.food.y;

            if (!isEating) {
                nextSnake.pop();
            }

            const wallCollision = head.x < 0 || head.x >= boardSize || head.y < 0 || head.y >= boardSize;
            const bodyCollision = nextSnake.slice(1).some(segment => segment.x === head.x && segment.y === head.y);

            if (wallCollision || bodyCollision) {
                endGame('Game Over!');
                return;
            }

            state.snake = nextSnake;

            if (isEating) {
                state.score += 10;
                updateScore();
                playTone(760, 0.12, 'triangle');

                if (state.score > state.bestScore) {
                    state.bestScore = state.score;
                    localStorage.setItem('snakeBestScore', String(state.bestScore));
                    updateBestScore();
                }

                placeFood();
                stopLoop();
                state.gameLoop = setInterval(tick, getSpeed());
            }

            drawBoard();
        }

        function changeDirection(key) {
            const newDirection = directions[key.toLowerCase()] || directions[key];

            if (!newDirection || !state.isRunning || state.isPaused) return;

            const isOpposite = newDirection.x === -state.direction.x && newDirection.y === -state.direction.y;
            if (isOpposite) return;

            state.pendingDirection = newDirection;
        }

        function handleKeydown(event) {
            const key = event.key.toLowerCase();
            const newDirection = directions[key] || directions[event.key];

            if (newDirection) {
                event.preventDefault();
                changeDirection(event.key);
                return;
            }

            if (event.key === ' ' && state.isRunning) {
                event.preventDefault();
                togglePause();
            }
        }

        startBtn.addEventListener('click', startGame);
        pauseBtn.addEventListener('click', togglePause);
        soundBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            localStorage.setItem('snakeSoundEnabled', String(soundEnabled));
            soundBtn.textContent = soundEnabled ? 'Sound on' : 'Sound off';
            soundBtn.setAttribute('aria-pressed', String(soundEnabled));
            soundBtn.setAttribute('aria-label', soundEnabled ? 'Turn sound off' : 'Turn sound on');
            if (soundEnabled) playTone(640, 0.1);
        });
        touchButtons.forEach(button => {
            button.addEventListener('pointerdown', event => {
                event.preventDefault();
                changeDirection(button.dataset.direction);
            });
        });
        document.addEventListener('keydown', handleKeydown);

        updateBestScore();
        updateScore();
        createBoard();
        resetGame();
        soundBtn.textContent = soundEnabled ? 'Sound on' : 'Sound off';
        soundBtn.setAttribute('aria-pressed', String(soundEnabled));
        soundBtn.setAttribute('aria-label', soundEnabled ? 'Turn sound off' : 'Turn sound on');
    </script>
</body>
</html>
